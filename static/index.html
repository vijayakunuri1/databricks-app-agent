<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unity Catalog Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #ff3621; letter-spacing: 0.02em; }
    header span.subtitle { font-size: 0.75rem; color: #6b7280; margin-left: 8px; }
    button#new-chat {
      background: transparent;
      border: 1px solid #374151;
      color: #9ca3af;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: border-color 0.2s, color 0.2s;
    }
    button#new-chat:hover { border-color: #ff3621; color: #ff3621; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #empty-state { margin: auto; text-align: center; color: #4b5563; }
    #empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
    #empty-state h2 { font-size: 1rem; font-weight: 500; color: #6b7280; }
    #empty-state p  { font-size: 0.8rem; margin-top: 6px; color: #4b5563; }
    #empty-state .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 16px;
    }
    #empty-state .chip {
      background: #1e2130; border: 1px solid #2d3148; border-radius: 20px;
      padding: 6px 14px; font-size: 0.78rem; cursor: pointer; color: #9ca3af;
      transition: background 0.15s, color 0.15s;
    }
    #empty-state .chip:hover { background: #2d3148; color: #e2e8f0; }

    .msg { display: flex; gap: 10px; max-width: 820px; width: 100%; align-self: center; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
    }
    .msg.user      .avatar { background: #ff3621; color: #fff; }
    .msg.assistant .avatar { background: #1e3a5f; color: #60a5fa; }
    .msg.error     .avatar { background: #7f1d1d; color: #fca5a5; }

    .bubble {
      padding: 10px 14px; border-radius: 12px;
      font-size: 0.875rem; line-height: 1.6; max-width: calc(100% - 48px);
    }
    .msg.user      .bubble { background: #1e3a5f; border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: #1a1d27; border: 1px solid #2d3148; border-bottom-left-radius: 4px; }
    .msg.error     .bubble { background: #1c0a0a; border: 1px solid #7f1d1d; border-bottom-left-radius: 4px; color: #fca5a5; }

    .bubble code {
      background: #0f1117; padding: 1px 5px; border-radius: 4px;
      font-family: "SF Mono", Consolas, monospace; font-size: 0.82em;
    }
    .bubble pre {
      background: #0b0d14; border: 1px solid #2d3148; border-radius: 8px;
      padding: 10px 12px; margin: 8px 0; overflow-x: auto;
      font-family: "SF Mono", Consolas, monospace; font-size: 0.8em; line-height: 1.5;
    }
    .bubble pre code { background: transparent; padding: 0; }
    .bubble strong { color: #f1f5f9; }
    .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.82em; }
    .bubble th, .bubble td { border: 1px solid #2d3148; padding: 5px 10px; text-align: left; }
    .bubble th { background: #1e2130; color: #93c5fd; }

    .thinking .bubble { display: flex; align-items: center; gap: 6px; color: #6b7280; font-style: italic; }
    .dot-pulse { display: flex; gap: 4px; }
    .dot-pulse span {
      width: 6px; height: 6px; border-radius: 50%; background: #4b5563;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    #input-area { flex-shrink: 0; padding: 12px 16px 16px; background: #0f1117; border-top: 1px solid #1a1d27; }
    #input-row {
      display: flex; gap: 8px; align-items: flex-end;
      max-width: 820px; margin: 0 auto;
      background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px;
      padding: 8px 12px; transition: border-color 0.2s;
    }
    #input-row:focus-within { border-color: #ff3621; }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      resize: none; color: #e2e8f0; font-size: 0.875rem; line-height: 1.5;
      max-height: 160px; min-height: 24px; font-family: inherit;
    }
    #user-input::placeholder { color: #4b5563; }
    #send-btn {
      width: 36px; height: 36px; border-radius: 8px; border: none;
      background: #ff3621; color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn:not(:disabled):hover { background: #e02d19; }
    #send-btn svg { width: 18px; height: 18px; }
    #input-hint { text-align: center; font-size: 0.7rem; color: #374151; margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Unity Catalog Chat</h1>
    <span class="subtitle">Powered by Databricks Llama 3.3 70B</span>
  </div>
  <button id="new-chat">+ New Chat</button>
</header>

<div id="messages">
  <div id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M3 5v4c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
      <path d="M3 9v4c0 1.66 4.03 3 9 3s9-1.34 9-3V9"/>
      <path d="M3 13v4c0 1.66 4.03 3 9 3s9-1.34 9-3v-4"/>
    </svg>
    <h2>Ask anything about your Unity Catalog</h2>
    <p>List catalogs, explore schemas, query tables with natural language</p>
    <div class="chips">
      <span class="chip" data-prompt="List all available catalogs">List all catalogs</span>
      <span class="chip" data-prompt="What schemas exist in the main catalog?">Schemas in main</span>
      <span class="chip" data-prompt="Show me the tables in the samples.nyctaxi schema">Tables in samples.nyctaxi</span>
      <span class="chip" data-prompt="Run: SELECT current_date()">Run a SQL query</span>
    </div>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Ask about catalogs, schemas, tables, or write a SQL query…"></textarea>
    <button id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <p id="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</div>

<script>
  let conversationHistory = [];
  let isLoading = false;

  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  function renderMarkdown(text) {
    let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code.trimEnd()}</code></pre>`);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  function appendMessage(role, contentHtml) {
    emptyState.style.display = 'none';
    const avatarText = role === 'user' ? 'You' : role === 'error' ? '!' : 'AI';
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="avatar">${avatarText}</div><div class="bubble">${contentHtml}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showThinking() {
    const div = appendMessage('assistant',
      '<div class="dot-pulse"><span></span><span></span><span></span></div> Thinking…');
    div.classList.add('thinking');
    return div;
  }

  async function sendMessage(userText) {
    userText = userText.trim();
    if (!userText || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    autoResize();

    appendMessage('user', renderMarkdown(userText));
    conversationHistory.push({ role: 'user', content: userText });

    const thinkingEl = showThinking();

    try {
      const res = await fetch('/api/v1/chat/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory }),
      });

      thinkingEl.remove();

      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { const j = await res.json(); detail = j.detail || detail; } catch {}
        appendMessage('error', `Request failed: ${detail}`);
        conversationHistory.pop();
        return;
      }

      const data = await res.json();
      conversationHistory.push({ role: 'assistant', content: data.message });
      appendMessage('assistant', renderMarkdown(data.message));

    } catch (err) {
      thinkingEl.remove();
      appendMessage('error', `Network error: ${err.message}`);
      conversationHistory.pop();
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(inputEl.value); }
  });
  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
  document.getElementById('new-chat').addEventListener('click', () => {
    conversationHistory = [];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = '';
    inputEl.focus();
  });
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      inputEl.value = chip.dataset.prompt;
      autoResize();
      sendMessage(inputEl.value);
    });
  });

  inputEl.focus();
</script>
</body>
</html>
